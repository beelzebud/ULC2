name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove tracked build tree (stale caches point at dev machines)
        shell: bash
        run: rm -rf build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-openssl-zlib-x64-windows-v1

      - name: Install OpenSSL and zlib
        run: vcpkg install openssl zlib --triplet x64-windows

      - name: Configure
        # No explicit generator: pick whatever Visual Studio the image has
        # (image VS versions shift over time; default platform is x64).
        # Tagged builds stamp the About-dialog version with the tag;
        # manual runs fall back to CMake's git describe.
        shell: bash
        run: |
          VER=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="-DAPP_VERSION=${GITHUB_REF_NAME}"
          fi
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake \
            $VER

      - name: Build
        run: cmake --build build --config Release --target emulator_updater

      - name: Deploy Qt runtime
        run: windeployqt --release --compiler-runtime build/Release/emulator_updater.exe

      - name: Copy OpenSSL runtime DLLs (if dynamically linked)
        shell: pwsh
        run: |
          Copy-Item C:\vcpkg\installed\x64-windows\bin\libcrypto-*.dll build/Release/ -ErrorAction SilentlyContinue
          Copy-Item C:\vcpkg\installed\x64-windows\bin\libssl-*.dll   build/Release/ -ErrorAction SilentlyContinue

      - name: Prune dev artifacts
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue build/Release/lzma_sdk.lib
          Remove-Item -ErrorAction SilentlyContinue build/Release/*.exp, build/Release/*.ilk

      - name: Bundle VC++ redistributable
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile build/Release/vc_redist.x64.exe

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path 'build/Release/*' -DestinationPath 'Release.zip' -Force

      # Manual runs: just verify the build and stash the zip as an artifact.
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Release
          path: Release.zip

      # Tag pushes: publish the release.
      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ULC2 ${{ github.ref_name }}
          body: |
            Multi-Emulator updating utility.

            **Install:** unzip and run `emulator_updater.exe`. If Windows complains about missing VC runtime, run the included `vc_redist.x64.exe` once.
          files: Release.zip
          fail_on_unmatched_files: true
